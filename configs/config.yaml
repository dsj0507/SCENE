MODEL:
  META_ARCHITECTURE: "SCENE"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  SEM_SEG_HEAD:
    NAME: "SCENEHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 171
    TRAIN_CLASS_JSON: "datasets/coco.json"
    TEST_CLASS_JSON: "datasets/coco.json"
    CLIP_PRETRAINED: "ViT-L/14@336px"
    IMAGE_ENCODER: "clip"
    PROMPT_DEPTH: 0
    PROMPT_LENGTH: 0
    TEXT_GUIDANCE_DIM: 768
    TEXT_GUIDANCE_PROJ_DIM: 128
    DECODER_DIMS: [64, 32]
    DECODER_GUIDANCE_DIMS: [256, 128]
    USE_CLIP_CORR: True
    DECODER_CLIP_GUIDANCE_DIMS: [0, 0]
    DECODER_CLIP_GUIDANCE_PROJ_DIMS: [0, 0]
    USE_REMOTE_CLIP: True 
    CLIP_PRETRAINED_REMOTE: "ViT-B/32"
    CLIP_PRETRAINED_WEIGHTS_REMOTE: "pretrained/RemoteCLIP-ViT-B-32.pt"
    DINO_FINETUNE: "freeze"
    DINO_WEIGHTS: ""
    USE_SAM3_PROPOSAL: True 
    SAM3_CHECKPOINT_PATH: "pretrained/sam3.pt"
    SAM3_BPE_PATH: "pretrained/bpe_simple_vocab_16e6.txt.gz"
    SAM3_CONFIDENCE_THRESHOLD: 0.5
    SAM3_PROMPT_MODE: "visual_text"
    SAM3_GEOMETRY_GRID_SIZES: [1, 2, 4]
    SAM3_GEOMETRY_INCLUDE_STRIPES: True
    SAM3_GEOMETRY_STRIPE_COUNT: 4
    SAM3_GEOMETRY_INCLUDE_CENTER: True
    SAM3_GEOMETRY_NMS_IOU_THRESHOLD: 0.85
    SAM3_GEOMETRY_BOX_SCALE: 1.15
    SAM3_GEOMETRY_MAX_PROMPTS: 16
    ENABLE_PROPOSAL_ANALYSIS: false
    PROPOSAL_MAX_NUM: 16 
    PROPOSAL_MIN_AREA: 16
    PROPOSAL_MATCH_IOU_THRESHOLD: 0.2
    PROPOSAL_MATCH_COVERAGE_THRESHOLD: 0.5
    PROPOSAL_QUALITY_SUPERVISION: False
    PROPOSAL_QUALITY_LOSS_WEIGHTING: True
    PROPOSAL_HARD_QUALITY_THRESHOLD: 0.16
    PROPOSAL_WEAK_QUALITY_THRESHOLD: 0.08
    PROPOSAL_HARD_MIN_IOU: 0.0
    PROPOSAL_WEAK_GRAPH_SUPERVISION: False
    PROPOSAL_QUALITY_FORMULA: "sqrt_iou_coverage"
    VL_LOSS_WEIGHT: 0.25
    VL_LOSS_TEMPERATURE: 0.07
    VL_LOSS_USE_FUSED_REGION: True 
    GRAPH_INSIDE_THRESHOLD: 0.8
    GRAPH_OVERLAP_THRESHOLD: 0.2
    GRAPH_ADJACENT_THRESHOLD: 0.01
    GRAPH_HIDDEN_DIM: 256
    GRAPH_NUM_LAYERS: 2
    GRAPH_MODE: "graph_context_fusion"
    USE_NODE_TEXT_MATCH: True
    LAMBDA_CONTEXT: 0.05 
    CONTEXT_BIAS_SCALE: 1.0
    NODE_MATCH_WEIGHT: 1.0
    NODE_PSEUDO_WEIGHT: 1.0
    NODE_ORIGINAL_AUX_WEIGHT: 0.5
    NODE_HARD_LOSS_CAP: 3.0
    NODE_CONSISTENCY_WEIGHT: 0.05
    NODE_GRAPH_CONSISTENCY_WEIGHT: 0.25
    ENABLE_NODE_PSEUDO_LOSS: False
    NODE_PSEUDO_START_EPOCH: 500
    RAW_CLIP_LOGIT_WEIGHT: 1.0
    NODE_PSEUDO_TOPK: 3
    NODE_PSEUDO_TEMPERATURE: 0.07
    NODE_PSEUDO_CONFIDENCE: 0.85
    NODE_PSEUDO_MARGIN: 0.2
    USE_REMOTE_FC_DECODER: True
    REMOTE_FC_BRANCH_DIM: 32
    REMOTE_FC_FINE_KERNELS: [3, 5, 7]
    REMOTE_FC_COARSE_KERNELS: [7, 9, 11]
    REMOTE_FC_FINE_DEPTH: 1
    REMOTE_FC_COARSE_DEPTH: 1
    NUM_HEADS: 4
    HIDDEN_DIMS: 128
    FEATURE_RESOLUTION: [24, 24]
    WINDOW_SIZES: 12
    CLIP_FINETUNE: "attention" 
  PROMPT_ENSEMBLE_TYPE: "imagenet"
SOLVER:
  IMS_PER_BATCH: 8 
  BASE_LR: 0.0002
  MAX_ITER: 15000 
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0001
  OPTIMIZER: "ADAMW"
  LR_SCHEDULER_NAME: "WarmupCosineLR"
  BACKBONE_MULTIPLIER: 0.01
  CLIP_MULTIPLIER: 0.01
  AMP:
    ENABLED: true
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
INPUT:
  MIN_SIZE_TRAIN: (384, )
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 640 
  MAX_SIZE_TEST: 2560
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: (384, 384)
    SINGLE_CATEGORY_MAX_AREA: 1.0
  COLOR_AUG_SSD: True
  SIZE_DIVISIBILITY: 384
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "mask_former_semantic"
TEST:
  EVAL_PERIOD: 20000 
  SLIDING_WINDOW: False
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 8 
LOG_PERIOD: 5
VERSION: 2
CUDNN_BENCHMARK: True
