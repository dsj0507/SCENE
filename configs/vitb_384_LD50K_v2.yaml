_BASE_: config.yaml
MODEL:
  SEM_SEG_HEAD:
    IN_FEATURES: ["res2", "res3", "res4"]
    NUM_CLASSES: 40
    TRAIN_CLASS_JSON: "datasets/landdiscover.json"
    TEST_CLASS_JSON: "datasets/potsdam.json"
    CLIP_PRETRAINED: "ViT-B/16"
    REGION_ENCODER_SOURCE: "clip"
    TEXT_GUIDANCE_DIM: 512
    DECODER_CLIP_GUIDANCE_DIMS: [256, 128]
    DECODER_CLIP_GUIDANCE_PROJ_DIMS: [32, 16]
    USE_ROTATE: False
    DINO_FINETUNE: "frozen"

    SAM3_CONFIDENCE_THRESHOLD: 0.4
    SAM3_PROMPT_MODE: "visual_geometry"
    SAM3_GEOMETRY_MAX_PROMPTS: 24
    PROPOSAL_MAX_NUM: 18
    PROPOSAL_MIN_AREA: 8
    PROPOSAL_MATCH_IOU_THRESHOLD: 0.03
    PROPOSAL_MATCH_COVERAGE_THRESHOLD: 0.7
    PROPOSAL_QUALITY_SUPERVISION: True
    PROPOSAL_HARD_QUALITY_THRESHOLD: 0.22
    PROPOSAL_HARD_MIN_IOU: 0.05

    NODE_MATCH_WEIGHT: 0.9
    NODE_PSEUDO_WEIGHT: 0.25
    NODE_ORIGINAL_AUX_WEIGHT: 0.10
    NODE_HARD_LOSS_CAP: 4.0
    NODE_CONSISTENCY_WEIGHT: 0.0
    NODE_GRAPH_CONSISTENCY_WEIGHT: 0.0
  PROMPT_ENSEMBLE_TYPE: "remote_sensing"

INPUT:
  MIN_SIZE_TEST: 768

DATASETS:
  TRAIN: ("LandDiscover_50K_full_train_sem_seg",)
  TEST: ("Potsdam_all_sem_seg",)

SOLVER:
  IMS_PER_BATCH: 4
  MAX_ITER: 25000
  BACKBONE_MULTIPLIER: 0.0
  CLIP_MULTIPLIER: 0.02
  CHECKPOINT_PERIOD: 6000

TEST:
  EVAL_PERIOD: 6000

SEED: 31
